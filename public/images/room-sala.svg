<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#fffbeb"/>
  <!-- Wall -->
  <rect x="0" y="0" width="800" height="450" fill="#f5f5f0"/>
  <!-- Floor -->
  <rect x="0" y="440" width="800" height="160" fill="#92400e" opacity="0.35"/>
  <!-- TV -->
  <rect x="280" y="80" width="240" height="140" rx="6" fill="#1f2937"/>
  <rect x="290" y="90" width="220" height="120" rx="4" fill="#374151"/>
  <text x="400" y="158" text-anchor="middle" font-family="Arial" font-size="14" fill="#9ca3af">TV</text>
  <!-- Sofa -->
  <rect x="160" y="310" width="300" height="120" rx="10" fill="#e91e8c" opacity="0.7"/>
  <rect x="160" y="290" width="300" height="40" rx="8" fill="#c4156f" opacity="0.8"/>
  <rect x="160" y="310" width="30" height="120" rx="6" fill="#c4156f" opacity="0.9"/>
  <rect x="430" y="310" width="30" height="120" rx="6" fill="#c4156f" opacity="0.9"/>
  <!-- Cushions -->
  <rect x="200" y="315" width="70" height="60" rx="6" fill="#f9a8d4"/>
  <rect x="285" y="315" width="70" height="60" rx="6" fill="#fbbf24"/>
  <rect x="370" y="315" width="70" height="60" rx="6" fill="#f9a8d4"/>
  <text x="400" y="565" text-anchor="middle" font-family="Arial" font-size="18" fill="#6b7280">Living Area with TV &amp; Sofa</text>
</svg>
